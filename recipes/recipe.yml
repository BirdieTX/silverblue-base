---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue-base
description: This is my personal OS image.
base-image: quay.io/fedora/fedora-silverblue
image-version: 44

modules:

  - type: dnf
    repos:
      copr:
        - ublue-os/packages
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      nonfree: rpmfusion
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - gnome-system-monitor
        - nano-default-editor
    install:
      packages:
        - terra-release-mesa

  - type: dnf
    replace:
      - from-repo: terra-mesa
        packages:
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-vulkan-drivers

  - type: dnf
    install:
      packages:
        - adw-gtk3-theme
        - alacritty
        - alsa-firmware
        - apr
        - apr-util
        - arimo-nerd-fonts
        - btop
        - cargo
        - cmatrix
        - distrobox
        - fastfetch
        - fdk-aac
        - ffmpeg-libs
        - ffmpegthumbnailer
        - fish
        - flatpak-spawn
        - fuse
        - fzf
        - google-arimo-fonts
        - google-droid-fonts-all
        - google-go-fonts
        - google-noto-fonts-all
        - google-noto-sans-cjk-fonts
        - google-noto-sans-egyptian-hieroglyphs-fonts
        - google-noto-sans-hk-fonts
        - google-noto-serif-cjk-fonts
        - google-roboto-fonts
        - google-roboto-mono-fonts
        - google-roboto-slab-fonts
        - google-rubik-fonts
        - grub2-tools-extra
        - gvfs-nfs
        - HandBrake
        - htop
        - ibus-mozc
        - ibus-unikey
        - intel-media-driver
        - jetbrains-mono-fonts-all
        - jetbrainsmono-nerd-fonts
        - just
        - kf6-kirigami-addons
        - libavcodec-freeworld
        - libcamera
        - libcamera-gstreamer
        - libcamera-ipa
        - libcamera-tools
        - libheif
        - libheif-freeworld
        - libimobiledevice-utils
        - libratbag-ratbagd
        - libva-utils
        - lshw
        - material-icons-fonts
        - net-tools
        - nvme-cli
        - nvtop
        - openrgb-udev-rules
        - openssl
        - oversteer
        - pam-u2f
        - pam_yubico
        - pamu2fcfg
        - pipewire-alsa
        - pipewire-codec-aptx
        - pipewire-gstreamer
        - pipewire-libs
        - powerstat
        - qt5ct
        - qt6ct
        - rsms-inter-fonts
        - rsms-inter-vf-fonts
        - rust
        - setroubleshoot
        - signal-cli
        - smartmontools
        - solaar-udev
        - squashfs-tools
        - starship
        - symlinks
        - tcpdump
        - terminus-fonts
        - terminus-fonts-console
        - tmux
        - traceroute
        - usbmuxd
        - yazi
        - yt-dlp
        - vim-default-editor
        - wireguard-tools
        - wl-clipboard
        - xhost
        - xorg-x11-xauth
        - yubikey-manager
        - zsh
        - zsh-autocomplete
        - zsh-autosuggestions
        - zsh-html
        - zsh-syntax-highlighting
        - zstd

  - type: signing
